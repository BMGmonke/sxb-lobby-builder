name: Build SXB lobby host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Impostor
        uses: actions/checkout@v4
        with:
          repository: Impostor/Impostor
          ref: v1.10.10
          path: impostor

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install SXB placeholder host client
        working-directory: impostor
        shell: bash
        run: |
          # BuildServiceProvider is supplied by this package; the app project
          # intentionally keeps the dependency local to the generated client.
          sed -i '/<PackageReference Include="Serilog.Sinks.Console"/a\    <PackageReference Include="Microsoft.Extensions.DependencyInjection" Version="10.0.0" />' src/Impostor.Client.App/Impostor.Client.App.csproj

          cat > src/Impostor.Client.App/Program.cs <<'CS'
          using System;
          using System.Net;
          using System.Threading.Tasks;
          using Impostor.Api.Games;
          using Impostor.Api.Innersloth;
          using Impostor.Api.Innersloth.GameOptions;
          using Impostor.Api.Net.Messages;
          using Impostor.Api.Net.Messages.C2S;
          using Impostor.Api.Net.Messages.S2C;
          using Impostor.Hazel;
          using Impostor.Hazel.Abstractions;
          using Impostor.Hazel.Extensions;
          using Impostor.Hazel.Udp;
          using Microsoft.Extensions.DependencyInjection;
          using Microsoft.Extensions.ObjectPool;
          using Serilog;

          namespace Impostor.Client.App
          {
              internal static class Program
              {
                  private static MessageWriter CreateHandshake(string name)
                  {
                      var writer = MessageWriter.Get(MessageType.Reliable);
                      writer.Write(50666750);
                      writer.Write(name);
                      writer.Write((uint)0);
                      writer.Write((uint)Language.English);
                      writer.Write((byte)QuickChatModes.FreeChatOrQuickChat);
                      new PlatformSpecificData(Platforms.Android, "Android").Serialize(writer);
                      writer.Write(0);
                      writer.Write((byte)0);
                      return writer;
                  }

                  private static async Task Main(string[] args)
                  {
                      Log.Logger = new LoggerConfiguration().WriteTo.Console().CreateLogger();

                      var services = new ServiceCollection();
                      services.AddHazel();
                      using var serviceProvider = services.BuildServiceProvider();
                      var readerPool = serviceProvider.GetRequiredService<ObjectPool<MessageReader>>();

                      var lobbyCreated = new TaskCompletionSource<GameCode>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var botJoinedAsHost = new TaskCompletionSource<int>(TaskCreationOptions.RunContinuationsAsynchronously);

                      using var creatorConnection = new UdpClientConnection(
                          new IPEndPoint(IPAddress.Loopback, 22023), readerPool);

                      creatorConnection.DataReceived = e =>
                      {
                          try
                          {
                              while (e.Message.Position < e.Message.Length)
                              {
                                  using var message = e.Message.ReadMessage();
                                  if (message.Tag == MessageFlags.HostGame)
                                  {
                                      Message00HostGameS2C.Deserialize(message, out var code);
                                      Log.Information("Lobby created. Code: {GameCode}", code.Code);
                                      lobbyCreated.TrySetResult(code);
                                  }
                              }
                          }
                          catch (Exception ex)
                          {
                              Log.Error(ex, "Could not decode lobby-creation response.");
                          }

                          return default;
                      };

                      creatorConnection.Disconnected = e =>
                      {
                          Log.Warning("Lobby creator disconnected: {Reason}", e.Reason);
                          lobbyCreated.TrySetException(new InvalidOperationException(e.Reason));
                          return default;
                      };

                      var creatorHandshake = CreateHandshake("SXBCreate");
                      var createGame = MessageWriter.Get(MessageType.Reliable);
                      Message00HostGameC2S.Serialize(createGame, new NormalGameOptions
                      {
                          MaxPlayers = 4,
                          NumImpostors = 1,
                      }, CrossplayFlags.All, GameFilterOptions.CreateDefault());

                      try
                      {
                          await creatorConnection.ConnectAsync(creatorHandshake.ToByteArray(false));
                          creatorHandshake.Recycle();
                          Log.Information("Lobby creator connected; requesting a lobby.");
                          await creatorConnection.SendAsync(createGame);
                          createGame.Recycle();

                          var created = await Task.WhenAny(lobbyCreated.Task, Task.Delay(TimeSpan.FromSeconds(15)));
                          if (created != lobbyCreated.Task)
                          {
                              throw new TimeoutException("No lobby code received within 15 seconds.");
                          }

                          var gameCode = await lobbyCreated.Task;

                          // The lobby-creation socket is not itself a game player. Join with a
                          // second client first so a real bot player receives HostId before humans.
                          using var botConnection = new UdpClientConnection(
                              new IPEndPoint(IPAddress.Loopback, 22023), readerPool);

                          botConnection.DataReceived = e =>
                          {
                              try
                              {
                                  while (e.Message.Position < e.Message.Length)
                                  {
                                      using var message = e.Message.ReadMessage();
                                      if (message.Tag == MessageFlags.JoinedGame)
                                      {
                                          var receivedCode = message.ReadInt32();
                                          var playerId = message.ReadInt32();
                                          var hostId = message.ReadInt32();
                                          if (receivedCode == gameCode.Value && playerId == hostId)
                                          {
                                              Log.Information("BMGmonke?! joined first and is now lobby host (player {PlayerId}).", playerId);
                                              botJoinedAsHost.TrySetResult(playerId);
                                          }
                                      }
                                  }
                              }
                              catch (Exception ex)
                              {
                                  Log.Error(ex, "Could not decode bot join response.");
                              }

                              return default;
                          };

                          botConnection.Disconnected = e =>
                          {
                              Log.Warning("BMGmonke?! disconnected: {Reason}", e.Reason);
                              botJoinedAsHost.TrySetException(new InvalidOperationException(e.Reason));
                              return default;
                          };

                          var botHandshake = CreateHandshake("BMGmonke?!");
                          try
                          {
                              await botConnection.ConnectAsync(botHandshake.ToByteArray(false));
                          }
                          finally
                          {
                              botHandshake.Recycle();
                          }

                          var joinGame = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              joinGame.StartMessage(MessageFlags.JoinGame);
                              joinGame.Write(gameCode.Value);
                              joinGame.Write(false);
                              joinGame.EndMessage();
                              await botConnection.SendAsync(joinGame);
                          }
                          finally
                          {
                              joinGame.Recycle();
                          }

                          var joined = await Task.WhenAny(botJoinedAsHost.Task, Task.Delay(TimeSpan.FromSeconds(15)));
                          if (joined != botJoinedAsHost.Task)
                          {
                              throw new TimeoutException("BMGmonke?! did not become the first player/host within 15 seconds.");
                          }

                          // Enter the actual game scene. Without SceneChangeFlag the
                          // server never synchronizes game objects or creates PlayerInfo.
                          var hostPlayerId = await botJoinedAsHost.Task;
                          var sceneChange = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              sceneChange.StartMessage(MessageFlags.GameData);
                              sceneChange.StartMessage(6); // GameDataTag.SceneChangeFlag
                              sceneChange.WritePacked(hostPlayerId);
                              sceneChange.Write("OnlineGame");
                              sceneChange.EndMessage();
                              sceneChange.EndMessage();
                              await botConnection.SendAsync(sceneChange);
                              Log.Information("BMGmonke?! sent OnlineGame scene transition for client {PlayerId}.", hostPlayerId);
                          }
                          finally
                          {
                              sceneChange.Recycle();
                          }

                          Log.Information("Waiting for host PlayerControl spawn; lobby is not ready for humans until this completes.");
                          await Task.Delay(TimeSpan.FromSeconds(60));
                      }
                      finally
                      {
                          creatorHandshake.Recycle();
                          createGame.Recycle();
                      }

                      Log.Information("60-second lobby window ended.");
                  }
              }
          }
          CS

      - name: Build ARM64 client
        working-directory: impostor
        run: dotnet publish src/Impostor.Client.App/Impostor.Client.App.csproj -c Release -r linux-arm64 --self-contained false -p:UseAppHost=false -o ../publish

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxb-lobby-host-linux-arm64
          path: publish/
          if-no-files-found: error
          retention-days: 7
