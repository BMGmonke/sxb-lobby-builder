name: Build SXB lobby host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Impostor
        uses: actions/checkout@v4
        with:
          repository: Impostor/Impostor
          ref: v1.10.10
          path: impostor

      - name: Check out SXB build scripts
        uses: actions/checkout@v4
        with:
          repository: BMGmonke/sxb-lobby-builder
          ref: main
          path: sxb-lobby-builder

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install SXB placeholder host client
        working-directory: impostor
        shell: bash
        run: |
          # BuildServiceProvider is supplied by this package; the app project
          # intentionally keeps the dependency local to the generated client.
          sed -i '/<PackageReference Include="Serilog.Sinks.Console"/a\    <PackageReference Include="Microsoft.Extensions.DependencyInjection" Version="10.0.0" />' src/Impostor.Client.App/Impostor.Client.App.csproj

          cat > src/Impostor.Client.App/Program.cs <<'CS'
          using System;
          using System.Net;
          using System.Net.Http;
          using System.Text.Json;
          using System.Threading.Tasks;
          using Impostor.Api.Games;
          using Impostor.Api.Innersloth;
          using Impostor.Api.Innersloth.GameOptions;
          using Impostor.Api.Net.Messages;
          using Impostor.Api.Net.Messages.C2S;
          using Impostor.Api.Net.Messages.S2C;
          using Impostor.Hazel;
          using Impostor.Hazel.Abstractions;
          using Impostor.Hazel.Extensions;
          using Impostor.Hazel.Udp;
          using Microsoft.Extensions.DependencyInjection;
          using Microsoft.Extensions.ObjectPool;
          using Serilog;

          namespace Impostor.Client.App
          {
              internal static class Program
              {
                  private static MessageWriter CreateHandshake(string name, int version = 50666750)
                  {
                      var writer = MessageWriter.Get(MessageType.Reliable);
                      writer.Write(version);
                      writer.Write(name);
                      writer.Write((uint)0);
                      writer.Write((uint)Language.English);
                      writer.Write((byte)QuickChatModes.FreeChatOrQuickChat);
                      new PlatformSpecificData(Platforms.Android, "Android").Serialize(writer);
                      writer.Write(0);
                      writer.Write((byte)0);
                      return writer;
                  }


                  private static readonly string FilterJson =
                      "{\"FilterSets\":[{\"GameMode\":1,\"Filters\":[{\"OptionType\":\"languages\",\"Key\":\"Language\",\"SubFilterString\":\"{\\\"FilterType\\\":\\\"languages\\\",\\\"AcceptedValues\\\":4294967295}\"},{\"OptionType\":\"chat\",\"Key\":\"Chat\",\"SubFilterString\":\"{\\\"FilterType\\\":\\\"chat\\\",\\\"AcceptedValues\\\":255}\"}]}]}";

                  private static async Task WatchForLobby(ObjectPool<MessageReader> readerPool)
                  {
                      using var http = new HttpClient { Timeout = TimeSpan.FromSeconds(8) };
                      var url = "http://127.0.0.1:22023/api/games/filtered?filter=" + Uri.EscapeDataString(FilterJson);
                      var seen = new System.Collections.Generic.HashSet<int>();
                      Log.Information("SXBWatcher is scanning for public Normal lobbies every 5 seconds.");
                      while (true)
                      {
                          try
                          {
                              using var response = await http.GetAsync(url);
                              response.EnsureSuccessStatusCode();
                              using var doc = JsonDocument.Parse(await response.Content.ReadAsStringAsync());
                              if (doc.RootElement.TryGetProperty("games", out var games) && games.ValueKind == JsonValueKind.Array)
                              {
                                  foreach (var game in games.EnumerateArray())
                                  {
                                      var id = game.GetProperty("GameId").GetInt32();
                                      if (!seen.Add(id)) continue;
                                      var ipNumber = game.GetProperty("IP").GetUInt32();
                                      var port = game.GetProperty("Port").GetUInt16();
                                      var code = new GameCode(id);
                                      Log.Information("New lobby detected: {Code} at {Ip}:{Port}. Attempting join.", code.Code, new IPAddress((long)ipNumber), port);
                                      if (await JoinLobby(code, new IPEndPoint(new IPAddress((long)ipNumber), port), readerPool))
                                      {
                                          Log.Information("SXBWatcher joined lobby {Code}. Monitoring the connection.", code.Code);
                                      }
                                      seen.Remove(id);
                                      Log.Warning("Join attempt for {Code} ended or failed. Lobby is eligible for another attempt.", code.Code);
                                  }
                              }
                          }
                          catch (Exception ex)
                          {
                              Log.Warning(ex, "Lobby scan failed; retrying in 5 seconds.");
                          }
                          await Task.Delay(TimeSpan.FromSeconds(5));
                      }
                  }

                  private static async Task<bool> JoinLobby(GameCode gameCode, IPEndPoint endpoint, ObjectPool<MessageReader> readerPool)
                  {
                      using var connection = new UdpClientConnection(endpoint, readerPool);
                      var joined = new TaskCompletionSource<bool>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var disconnected = new TaskCompletionSource<string>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var joinedPlayerId = -1;
                      var playerControlSpawned = new TaskCompletionSource<bool>(TaskCreationOptions.RunContinuationsAsynchronously);
                      connection.DataReceived = e =>
                      {
                          try
                          {
                              while (e.Message.Position < e.Message.Length)
                              {
                                  using var message = e.Message.ReadMessage();
                                  if (message.Tag == MessageFlags.JoinedGame)
                                  {
                                      var receivedCode = message.ReadInt32();
                                      var playerId = message.ReadInt32();
                                      var hostId = message.ReadInt32();
                                      if (receivedCode == gameCode.Value)
                                      {
                                          joinedPlayerId = playerId;
                                          Log.Information("SXBWatcher received JoinedGame: player {PlayerId}, lobby host {HostId}.", playerId, hostId);
                                          joined.TrySetResult(true);
                                      }
                                  }
                                  else if (message.Tag == MessageFlags.GameData || message.Tag == MessageFlags.GameDataTo)
                                  {
                                      var receivedCode = message.ReadInt32();
                                      if (message.Tag == MessageFlags.GameDataTo) message.ReadPackedInt32();
                                      if (receivedCode != gameCode.Value) continue;
                                      while (message.Position < message.Length)
                                      {
                                          using var gameData = message.ReadMessage();
                                          if (gameData.Tag != 4) continue; // GameDataTag.SpawnFlag
                                          var objectType = gameData.ReadPackedUInt32();
                                          var ownerId = gameData.ReadPackedInt32();
                                          gameData.ReadByte(); // SpawnFlags
                                          var componentCount = gameData.ReadPackedInt32();
                                          for (var component = 0; component < componentCount; component++)
                                          {
                                              gameData.ReadPackedUInt32(); // component NetId
                                              using var payload = gameData.ReadMessage();
                                          }
                                          if (objectType == 4 && ownerId == joinedPlayerId)
                                          {
                                              Log.Information("SXBWatcher received its PlayerControl spawn ({ComponentCount} components, owner {OwnerId}).", componentCount, ownerId);
                                              playerControlSpawned.TrySetResult(true);
                                          }
                                      }
                                  }
                              }
                          }
                          catch (Exception ex) { Log.Error(ex, "Could not decode watcher join/synchronization response."); }
                          return default;
                      };
                      connection.Disconnected = e =>
                      {
                          Log.Warning("SXBWatcher disconnected: {Reason}", e.Reason);
                          joined.TrySetResult(false);
                          disconnected.TrySetResult(e.Reason);
                          return default;
                      };

                      var handshake = CreateHandshake("SXBWatcher");
                      try { await connection.ConnectAsync(handshake.ToByteArray(false)); }
                      finally { handshake.Recycle(); }

                      var request = MessageWriter.Get(MessageType.Reliable);
                      try
                      {
                          request.StartMessage(MessageFlags.JoinGame);
                          request.Write(gameCode.Value);
                          request.Write(false);
                          request.EndMessage();
                          await connection.SendAsync(request);
                      }
                      finally { request.Recycle(); }

                      var completed = await Task.WhenAny(joined.Task, Task.Delay(TimeSpan.FromSeconds(12)));
                      if (completed != joined.Task || !await joined.Task) return false;

                      // JoinedGame registers the connection, but does not create the
                      // visible player object. Each client must enter OnlineGame.
                      var sceneChange = MessageWriter.Get(MessageType.Reliable);
                      try
                      {
                          sceneChange.StartMessage(MessageFlags.GameData);
                          sceneChange.Write(gameCode.Value);
                          sceneChange.StartMessage(6); // GameDataTag.SceneChangeFlag
                          sceneChange.WritePacked(joinedPlayerId);
                          sceneChange.Write("OnlineGame");
                          sceneChange.EndMessage();
                          sceneChange.EndMessage();
                          await connection.SendAsync(sceneChange);
                          Log.Information("SXBWatcher sent OnlineGame scene transition for player {PlayerId}.", joinedPlayerId);
                      }
                      finally { sceneChange.Recycle(); }

                      var clientReady = MessageWriter.Get(MessageType.Reliable);
                      try
                      {
                          clientReady.StartMessage(MessageFlags.GameData);
                          clientReady.Write(gameCode.Value);
                          clientReady.StartMessage(7); // GameDataTag.ReadyFlag
                          clientReady.WritePacked(joinedPlayerId);
                          clientReady.EndMessage();
                          clientReady.EndMessage();
                          await connection.SendAsync(clientReady);
                          Log.Information("SXBWatcher sent ReadyFlag for player {PlayerId}.", joinedPlayerId);
                      }
                      finally { clientReady.Recycle(); }

                      Log.Information("SXBWatcher completed the lobby scene handshake; checking for its server-created PlayerControl.");
                      var spawnResult = await Task.WhenAny(playerControlSpawned.Task, disconnected.Task, Task.Delay(TimeSpan.FromSeconds(10)));
                      if (spawnResult == playerControlSpawned.Task && await playerControlSpawned.Task)
                      {
                          Log.Information("SXBWatcher confirmed its PlayerControl was delivered by the server.");
                      }
                      else if (spawnResult == disconnected.Task)
                      {
                          Log.Warning("SXBWatcher was disconnected before its PlayerControl spawn.");
                          return false;
                      }
                      else
                      {
                          // Public lobby servers may not send a PlayerControl
                          // to a protocol-only client. Do not tear down the
                          // joined player after an arbitrary 10-second timeout:
                          // the server/host still needs this connection alive
                          // to finish replicating the PlayerInfo and spawn.
                          Log.Warning("SXBWatcher is still connected, but no PlayerControl spawn arrived within 10 seconds. Keeping the lobby session alive.");
                      }
                      var disconnectReason = await disconnected.Task;
                      Log.Warning("SXBWatcher connection ended after joining: {Reason}", disconnectReason);
                      return false;
                  }

                  private static async Task Main(string[] args)
                  {
                      Log.Logger = new LoggerConfiguration().WriteTo.Console().CreateLogger();

                      var services = new ServiceCollection();
                      services.AddHazel();
                      using var serviceProvider = services.BuildServiceProvider();
                      var readerPool = serviceProvider.GetRequiredService<ObjectPool<MessageReader>>();

                      if (args.Length > 0 && args[0] == "--watch")
                      {
                          await WatchForLobby(readerPool);
                          return;
                      }

                      if (args.Length > 0 && args[0] == "--join" && args.Length >= 4)
                      {
                          var targetCode = new GameCode(args[1]);
                          var targetIp = IPAddress.Parse(args[2]);
                          var targetPort = ushort.Parse(args[3]);
                          await JoinLobby(targetCode, new IPEndPoint(targetIp, targetPort), readerPool);
                          return;
                      }

                      var lobbyCreated = new TaskCompletionSource<GameCode>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var botJoinedAsHost = new TaskCompletionSource<int>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var watcherControlSeen = new TaskCompletionSource<bool>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var watcherPlayerInfoSeen = new TaskCompletionSource<bool>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var hostPlayerId = -1;

                      using var creatorConnection = new UdpClientConnection(
                          new IPEndPoint(IPAddress.Loopback, 22023), readerPool);

                      creatorConnection.DataReceived = e =>
                      {
                          try
                          {
                              while (e.Message.Position < e.Message.Length)
                              {
                                  using var message = e.Message.ReadMessage();
                                  if (message.Tag == MessageFlags.HostGame)
                                  {
                                      Message00HostGameS2C.Deserialize(message, out var code);
                                      Log.Information("Lobby created. Code: {GameCode}", code.Code);
                                      lobbyCreated.TrySetResult(code);
                                  }
                                  else if (message.Tag == MessageFlags.JoinedGame)
                                  {
                                      var receivedCode = message.ReadInt32();
                                      var playerId = message.ReadInt32();
                                      var hostId = message.ReadInt32();
                                      if (lobbyCreated.Task.IsCompletedSuccessfully &&
                                          receivedCode == lobbyCreated.Task.Result.Value &&
                                          playerId == hostId)
                                      {
                                          hostPlayerId = playerId;
                                          Log.Information("BMGmonke?! joined as the actual lobby host (client {PlayerId}).", playerId);
                                          botJoinedAsHost.TrySetResult(playerId);
                                      }
                                  }
                                  else if (message.Tag == MessageFlags.GameData || message.Tag == MessageFlags.GameDataTo)
                                  {
                                      var receivedCode = message.ReadInt32();
                                      if (message.Tag == MessageFlags.GameDataTo) message.ReadPackedInt32();
                                      if (receivedCode != lobbyCreated.Task.Result.Value) continue;
                                      while (message.Position < message.Length)
                                      {
                                          using var gameData = message.ReadMessage();
                                          if (gameData.Tag != 4) continue; // GameDataTag.SpawnFlag
                                          var objectType = gameData.ReadPackedUInt32();
                                          var ownerId = gameData.ReadPackedInt32();
                                          gameData.ReadByte();
                                          var componentCount = gameData.ReadPackedInt32();
                                          var spawnedClientId = -1;
                                          for (var component = 0; component < componentCount; component++)
                                          {
                                              gameData.ReadPackedUInt32();
                                              using var payload = gameData.ReadMessage();
                                              if (objectType == 11 && component == 0)
                                              {
                                                  payload.ReadByte(); // PlayerId
                                                  spawnedClientId = payload.ReadPackedInt32(); // ClientId
                                              }
                                          }
                                          if (objectType == 11 && spawnedClientId != -1 && spawnedClientId != hostPlayerId)
                                          {
                                              Log.Information("BMGmonke?! received PlayerInfo for another lobby member (client {ClientId}).", spawnedClientId);
                                              watcherPlayerInfoSeen.TrySetResult(true);
                                          }
                                          if (objectType == 4 && ownerId != hostPlayerId)
                                          {
                                              Log.Information("BMGmonke?! received another player's PlayerControl spawn (owner {OwnerId}, {ComponentCount} components).", ownerId, componentCount);
                                              watcherControlSeen.TrySetResult(true);
                                          }
                                      }
                                  }
                              }
                          }
                          catch (Exception ex)
                          {
                              Log.Error(ex, "Could not decode lobby-creation response.");
                          }

                          return default;
                      };

                      creatorConnection.Disconnected = e =>
                      {
                          Log.Warning("Lobby creator disconnected: {Reason}", e.Reason);
                          lobbyCreated.TrySetException(new InvalidOperationException(e.Reason));
                          return default;
                      };

                      // Revision 25 sets Impostor's DisableServerAuthority flag, matching
                      // real public-lobby hosts that own PlayerInfo spawning.
                      var creatorHandshake = CreateHandshake("BMGmonke?!", 50666775);
                      var createGame = MessageWriter.Get(MessageType.Reliable);
                      Message00HostGameC2S.Serialize(createGame, new NormalGameOptions
                      {
                          MaxPlayers = 4,
                          Map = MapTypes.Polus,
                          NumImpostors = 1,
                      }, CrossplayFlags.All, GameFilterOptions.CreateDefault());

                      try
                      {
                          await creatorConnection.ConnectAsync(creatorHandshake.ToByteArray(false));
                          creatorHandshake.Recycle();
                          Log.Information("Lobby creator connected; requesting a lobby.");
                          await creatorConnection.SendAsync(createGame);
                          createGame.Recycle();

                          var created = await Task.WhenAny(lobbyCreated.Task, Task.Delay(TimeSpan.FromSeconds(15)));
                          if (created != lobbyCreated.Task)
                          {
                              throw new TimeoutException("No lobby code received within 15 seconds.");
                          }

                          var gameCode = await lobbyCreated.Task;

                          // The connection that created the lobby must also join it.
                          // Impostor assigns HostId to the first player added; using a
                          // second socket here left the creator as an owner-only connection.
                          var joinGame = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              joinGame.StartMessage(MessageFlags.JoinGame);
                              joinGame.Write(gameCode.Value);
                              joinGame.Write(false);
                              joinGame.EndMessage();
                              await creatorConnection.SendAsync(joinGame);
                              Log.Information("BMGmonke?! requested to join its own lobby.");
                          }
                          finally
                          {
                              joinGame.Recycle();
                          }

                          var joined = await Task.WhenAny(botJoinedAsHost.Task, Task.Delay(TimeSpan.FromSeconds(15)));
                          if (joined != botJoinedAsHost.Task)
                          {
                              throw new TimeoutException("BMGmonke?! did not receive JoinedGame as lobby host within 15 seconds.");
                          }

                          hostPlayerId = await botJoinedAsHost.Task;
                          var sceneChange = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              sceneChange.StartMessage(MessageFlags.GameData);
                              sceneChange.Write(gameCode.Value);
                              sceneChange.StartMessage(6); // GameDataTag.SceneChangeFlag
                              sceneChange.WritePacked(hostPlayerId);
                              sceneChange.Write("OnlineGame");
                              sceneChange.EndMessage();
                              sceneChange.EndMessage();
                              await creatorConnection.SendAsync(sceneChange);
                              Log.Information("BMGmonke?! entered OnlineGame as host {PlayerId}.", hostPlayerId);
                          }
                          finally
                          {
                              sceneChange.Recycle();
                          }

                          var clientReady = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              clientReady.StartMessage(MessageFlags.GameData);
                              clientReady.Write(gameCode.Value);
                              clientReady.StartMessage(7); // GameDataTag.ReadyFlag
                              clientReady.WritePacked(hostPlayerId);
                              clientReady.EndMessage();
                              clientReady.EndMessage();
                              await creatorConnection.SendAsync(clientReady);
                              Log.Information("BMGmonke?! sent ReadyFlag for host {PlayerId}.", hostPlayerId);
                          }
                          finally
                          {
                              clientReady.Recycle();
                          }

                          // Publish the lobby so normal clients and SXBWatcher can discover it.
                          var makePublic = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              makePublic.StartMessage(MessageFlags.AlterGame);
                              makePublic.Write(gameCode.Value);
                              makePublic.Write((byte)AlterGameTags.ChangePrivacy);
                              makePublic.Write(true);
                              makePublic.EndMessage();
                              await creatorConnection.SendAsync(makePublic);
                              Log.Information("BMGmonke?! made lobby {GameCode} public.", gameCode.Code);
                          }
                          finally
                          {
                              makePublic.Recycle();
                          }

                          Log.Information("BMGmonke?! is staying connected. The lobby remains open for humans until the host process is stopped.");
                          await Task.Delay(System.Threading.Timeout.InfiniteTimeSpan);
                      }
                      finally
                      {
                          creatorHandshake.Recycle();
                          createGame.Recycle();
                      }


                  }
              }
          }
          CS

      - name: Patch SXB bot spawning
        working-directory: impostor
        shell: bash
        run: python3 ../sxb-lobby-builder/scripts/patch_server.py

      - name: Build patched ARM64 server
        working-directory: impostor
        run: dotnet publish src/Impostor.Server/Impostor.Server.csproj -c Release -r linux-arm64 --self-contained false -p:UseAppHost=false -o ../server-publish

      - name: Upload patched ARM64 server
        uses: actions/upload-artifact@v4
        with:
          name: sxb-impostor-server-linux-arm64
          path: server-publish/
          if-no-files-found: error
          retention-days: 7

      - name: Build ARM64 client
        working-directory: impostor
        run: dotnet publish src/Impostor.Client.App/Impostor.Client.App.csproj -c Release -r linux-arm64 --self-contained false -p:UseAppHost=false -o ../publish

      - name: Smoke test Polus map and player spawn serialization
        working-directory: impostor
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Impostor.Server/Impostor.Server.csproj -c Release -r linux-x64 --self-contained false -p:UseAppHost=false -o ../server-smoke
          dotnet publish src/Impostor.Client.App/Impostor.Client.App.csproj -c Release -r linux-x64 --self-contained false -p:UseAppHost=false -o ../host-smoke

          cd ../server-smoke
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("config.json")
          config = json.loads(p.read_text())
          config["Server"]["PublicIp"] = "127.0.0.1"
          config["Server"]["PublicPort"] = 22023
          config["Server"]["ListenIp"] = "127.0.0.1"
          config["Server"]["ListenPort"] = 22023
          config["HttpServer"]["ListenIp"] = "127.0.0.1"
          config["HttpServer"]["ListenPort"] = 22023
          p.write_text(json.dumps(config))
          PY
          dotnet Impostor.Server.dll > "$RUNNER_TEMP/sxb-server-smoke.log" 2>&1 &
          SERVER_PID=$!
          HOST_PID=""
          WATCHER_PID=""
          cleanup_smoke() {
            [ -z "$WATCHER_PID" ] || kill "$WATCHER_PID" 2>/dev/null || true
            [ -z "$HOST_PID" ] || kill "$HOST_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup_smoke EXIT

          # Wait for the local HTTP listing endpoint before launching either client.
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:22023/ >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          [ "$READY" = 1 ] || { echo "Smoke server did not become ready."; tail -n 100 "$RUNNER_TEMP/sxb-server-smoke.log"; exit 1; }

          cd ../host-smoke
          dotnet Impostor.Client.App.dll > "$RUNNER_TEMP/sxb-host-smoke.log" 2>&1 &
          HOST_PID=$!

          # Wait until the host has spawned and advertised its public lobby.
          PUBLIC=0
          for i in $(seq 1 30); do
            if grep -q "made lobby .* public" "$RUNNER_TEMP/sxb-host-smoke.log"; then PUBLIC=1; break; fi
            if ! kill -0 "$HOST_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$PUBLIC" != 1 ]; then
            echo "Host did not publish its lobby."
            cat "$RUNNER_TEMP/sxb-host-smoke.log"
            tail -n 120 "$RUNNER_TEMP/sxb-server-smoke.log"
            exit 1
          fi

          # Exercise option 5 against the live public lobby and verify the real join handshake.
          set +e
          timeout 20s dotnet Impostor.Client.App.dll --watch > "$RUNNER_TEMP/sxb-watcher-smoke.log" 2>&1
          WATCH_STATUS=$?
          set -e
          if [ "$WATCH_STATUS" -ne 124 ] && [ "$WATCH_STATUS" -ne 0 ]; then
            echo "Watcher exited unexpectedly with status $WATCH_STATUS."
            cat "$RUNNER_TEMP/sxb-watcher-smoke.log"
            exit 1
          fi

          echo "===== SXB host smoke-test log ====="
          cat "$RUNNER_TEMP/sxb-host-smoke.log"
          echo "===== SXB watcher smoke-test log ====="
          cat "$RUNNER_TEMP/sxb-watcher-smoke.log"
          echo "===== Impostor server smoke-test log ====="
          tail -n 160 "$RUNNER_TEMP/sxb-server-smoke.log"

          grep -q "Lobby created. Code:" "$RUNNER_TEMP/sxb-host-smoke.log"
          grep -q "BMGmonke?! joined as the actual lobby host" "$RUNNER_TEMP/sxb-host-smoke.log"
          grep -q "made lobby .* public" "$RUNNER_TEMP/sxb-host-smoke.log"
          grep -q "SXBWatcher is scanning for public Normal lobbies" "$RUNNER_TEMP/sxb-watcher-smoke.log"
          grep -q "New lobby detected:" "$RUNNER_TEMP/sxb-watcher-smoke.log"
          grep -q "SXBWatcher received JoinedGame:" "$RUNNER_TEMP/sxb-watcher-smoke.log"
          grep -q "SXBWatcher received its PlayerControl spawn" "$RUNNER_TEMP/sxb-watcher-smoke.log"
          grep -q "SXBWatcher confirmed its PlayerControl was delivered" "$RUNNER_TEMP/sxb-watcher-smoke.log"
          grep -q "BMGmonke?! received another player's PlayerControl spawn" "$RUNNER_TEMP/sxb-host-smoke.log"
          grep -q "BMGmonke?! received PlayerInfo for another lobby member" "$RUNNER_TEMP/sxb-host-smoke.log"
          grep -q "host-authoritative=True" "$RUNNER_TEMP/sxb-server-smoke.log"
          grep -q "Published lobby behaviour" "$RUNNER_TEMP/sxb-server-smoke.log"
          grep -q "Published Polus ship object" "$RUNNER_TEMP/sxb-server-smoke.log"
          grep -q "Spawned server-side PlayerControl" "$RUNNER_TEMP/sxb-server-smoke.log"
          if grep -q "NotImplementedException" "$RUNNER_TEMP/sxb-server-smoke.log"; then
            echo "Smoke test failed: an unimplemented serializer crashed object spawning."
            exit 1
          fi
          echo "SXB host spawn and option-5 public-lobby discovery/join smoke tests passed."

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxb-lobby-host-linux-arm64
          path: publish/
          if-no-files-found: error
          retention-days: 7

      - name: Package public ARM64 downloads
        shell: bash
        run: |
          cd server-publish && zip -qr ../sxb-impostor-server-linux-arm64.zip . && cd ..
          cd publish && zip -qr ../sxb-lobby-host-linux-arm64.zip . && cd ..

      - name: Publish public release downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sxb-latest
