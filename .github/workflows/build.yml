name: Build SXB lobby host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Impostor
        uses: actions/checkout@v4
        with:
          repository: Impostor/Impostor
          ref: v1.10.10
          path: impostor

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install SXB placeholder host client
        working-directory: impostor
        shell: bash
        run: |
          # BuildServiceProvider is supplied by this package; the app project
          # intentionally keeps the dependency local to the generated client.
          sed -i '/<PackageReference Include="Serilog.Sinks.Console"/a\    <PackageReference Include="Microsoft.Extensions.DependencyInjection" Version="10.0.0" />' src/Impostor.Client.App/Impostor.Client.App.csproj

          cat > src/Impostor.Client.App/Program.cs <<'CS'
          using System;
          using System.Net;
          using System.Net.Http;
          using System.Text.Json;
          using System.Threading.Tasks;
          using Impostor.Api.Games;
          using Impostor.Api.Innersloth;
          using Impostor.Api.Innersloth.GameOptions;
          using Impostor.Api.Net.Messages;
          using Impostor.Api.Net.Messages.C2S;
          using Impostor.Api.Net.Messages.S2C;
          using Impostor.Hazel;
          using Impostor.Hazel.Abstractions;
          using Impostor.Hazel.Extensions;
          using Impostor.Hazel.Udp;
          using Microsoft.Extensions.DependencyInjection;
          using Microsoft.Extensions.ObjectPool;
          using Serilog;

          namespace Impostor.Client.App
          {
              internal static class Program
              {
                  private static MessageWriter CreateHandshake(string name)
                  {
                      var writer = MessageWriter.Get(MessageType.Reliable);
                      writer.Write(50666750);
                      writer.Write(name);
                      writer.Write((uint)0);
                      writer.Write((uint)Language.English);
                      writer.Write((byte)QuickChatModes.FreeChatOrQuickChat);
                      new PlatformSpecificData(Platforms.Android, "Android").Serialize(writer);
                      writer.Write(0);
                      writer.Write((byte)0);
                      return writer;
                  }


                  private static readonly string FilterJson =
                      "{\"FilterSets\":[{\"GameMode\":1,\"Filters\":[{\"OptionType\":\"languages\",\"Key\":\"Language\",\"SubFilterString\":\"{\\\"FilterType\\\":\\\"languages\\\",\\\"AcceptedValues\\\":256}\"},{\"OptionType\":\"chat\",\"Key\":\"Chat\",\"SubFilterString\":\"{\\\"FilterType\\\":\\\"chat\\\",\\\"AcceptedValues\\\":3}\"}]}]}";

                  private static async Task WatchForLobby(ObjectPool<MessageReader> readerPool)
                  {
                      using var http = new HttpClient { Timeout = TimeSpan.FromSeconds(8) };
                      var url = "http://127.0.0.1:22023/api/games/filtered?filter=" + Uri.EscapeDataString(FilterJson);
                      var seen = new System.Collections.Generic.HashSet<int>();
                      Log.Information("SXBWatcher is scanning for public Normal lobbies every 5 seconds.");
                      while (true)
                      {
                          try
                          {
                              using var response = await http.GetAsync(url);
                              response.EnsureSuccessStatusCode();
                              using var doc = JsonDocument.Parse(await response.Content.ReadAsStringAsync());
                              if (doc.RootElement.TryGetProperty("games", out var games) && games.ValueKind == JsonValueKind.Array)
                              {
                                  foreach (var game in games.EnumerateArray())
                                  {
                                      var id = game.GetProperty("GameId").GetInt32();
                                      if (!seen.Add(id)) continue;
                                      var ipNumber = game.GetProperty("IP").GetUInt32();
                                      var port = game.GetProperty("Port").GetUInt16();
                                      var code = new GameCode(id);
                                      Log.Information("New lobby detected: {Code} at {Ip}:{Port}. Attempting join.", code.Code, new IPAddress((long)ipNumber), port);
                                      if (await JoinLobby(code, new IPEndPoint(new IPAddress((long)ipNumber), port), readerPool))
                                      {
                                          Log.Information("SXBWatcher joined lobby {Code}. Monitoring the connection.", code.Code);
                                      }
                                      seen.Remove(id);
                                      Log.Warning("Join attempt for {Code} ended or failed. Lobby is eligible for another attempt.", code.Code);
                                  }
                              }
                          }
                          catch (Exception ex)
                          {
                              Log.Warning(ex, "Lobby scan failed; retrying in 5 seconds.");
                          }
                          await Task.Delay(TimeSpan.FromSeconds(5));
                      }
                  }

                  private static async Task<bool> JoinLobby(GameCode gameCode, IPEndPoint endpoint, ObjectPool<MessageReader> readerPool)
                  {
                      using var connection = new UdpClientConnection(endpoint, readerPool);
                      var joined = new TaskCompletionSource<bool>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var disconnected = new TaskCompletionSource<string>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var joinedPlayerId = -1;
                      connection.DataReceived = e =>
                      {
                          try
                          {
                              while (e.Message.Position < e.Message.Length)
                              {
                                  using var message = e.Message.ReadMessage();
                                  if (message.Tag == MessageFlags.JoinedGame)
                                  {
                                      var receivedCode = message.ReadInt32();
                                      var playerId = message.ReadInt32();
                                      var hostId = message.ReadInt32();
                                      if (receivedCode == gameCode.Value)
                                      {
                                          joinedPlayerId = playerId;
                                          Log.Information("SXBWatcher received JoinedGame: player {PlayerId}, lobby host {HostId}.", playerId, hostId);
                                          joined.TrySetResult(true);
                                      }
                                  }
                              }
                          }
                          catch (Exception ex) { Log.Error(ex, "Could not decode watcher join response."); }
                          return default;
                      };
                      connection.Disconnected = e =>
                      {
                          Log.Warning("SXBWatcher disconnected: {Reason}", e.Reason);
                          joined.TrySetResult(false);
                          disconnected.TrySetResult(e.Reason);
                          return default;
                      };

                      var handshake = CreateHandshake("SXBWatcher");
                      try { await connection.ConnectAsync(handshake.ToByteArray(false)); }
                      finally { handshake.Recycle(); }

                      var request = MessageWriter.Get(MessageType.Reliable);
                      try
                      {
                          request.StartMessage(MessageFlags.JoinGame);
                          request.Write(gameCode.Value);
                          request.Write(false);
                          request.EndMessage();
                          await connection.SendAsync(request);
                      }
                      finally { request.Recycle(); }

                      var completed = await Task.WhenAny(joined.Task, Task.Delay(TimeSpan.FromSeconds(12)));
                      if (completed != joined.Task || !await joined.Task) return false;

                      // JoinedGame registers the connection, but does not create the
                      // visible player object. Each client must enter OnlineGame.
                      var sceneChange = MessageWriter.Get(MessageType.Reliable);
                      try
                      {
                          sceneChange.StartMessage(MessageFlags.GameData);
                          sceneChange.Write(gameCode.Value);
                          sceneChange.StartMessage(6); // GameDataTag.SceneChangeFlag
                          sceneChange.WritePacked(joinedPlayerId);
                          sceneChange.Write("OnlineGame");
                          sceneChange.EndMessage();
                          sceneChange.EndMessage();
                          await connection.SendAsync(sceneChange);
                          Log.Information("SXBWatcher sent OnlineGame scene transition for player {PlayerId}.", joinedPlayerId);
                      }
                      finally { sceneChange.Recycle(); }

                      var clientReady = MessageWriter.Get(MessageType.Reliable);
                      try
                      {
                          clientReady.StartMessage(MessageFlags.GameData);
                          clientReady.Write(gameCode.Value);
                          clientReady.StartMessage(7); // GameDataTag.ReadyFlag
                          clientReady.WritePacked(joinedPlayerId);
                          clientReady.EndMessage();
                          clientReady.EndMessage();
                          await connection.SendAsync(clientReady);
                          Log.Information("SXBWatcher sent ReadyFlag for player {PlayerId}.", joinedPlayerId);
                      }
                      finally { clientReady.Recycle(); }

                      Log.Information("SXBWatcher completed the lobby scene handshake; waiting for server synchronization.");
                      var disconnectReason = await disconnected.Task;
                      Log.Warning("SXBWatcher connection ended after joining: {Reason}", disconnectReason);
                      return false;
                  }

                  private static async Task Main(string[] args)
                  {
                      Log.Logger = new LoggerConfiguration().WriteTo.Console().CreateLogger();

                      var services = new ServiceCollection();
                      services.AddHazel();
                      using var serviceProvider = services.BuildServiceProvider();
                      var readerPool = serviceProvider.GetRequiredService<ObjectPool<MessageReader>>();

                      if (args.Length > 0 && args[0] == "--watch")
                      {
                          await WatchForLobby(readerPool);
                          return;
                      }

                      if (args.Length > 0 && args[0] == "--join" && args.Length >= 4)
                      {
                          var targetCode = new GameCode(args[1]);
                          var targetIp = IPAddress.Parse(args[2]);
                          var targetPort = ushort.Parse(args[3]);
                          await JoinLobby(targetCode, new IPEndPoint(targetIp, targetPort), readerPool);
                          return;
                      }

                      var lobbyCreated = new TaskCompletionSource<GameCode>(TaskCreationOptions.RunContinuationsAsynchronously);
                      var botJoinedAsHost = new TaskCompletionSource<int>(TaskCreationOptions.RunContinuationsAsynchronously);

                      using var creatorConnection = new UdpClientConnection(
                          new IPEndPoint(IPAddress.Loopback, 22023), readerPool);

                      creatorConnection.DataReceived = e =>
                      {
                          try
                          {
                              while (e.Message.Position < e.Message.Length)
                              {
                                  using var message = e.Message.ReadMessage();
                                  if (message.Tag == MessageFlags.HostGame)
                                  {
                                      Message00HostGameS2C.Deserialize(message, out var code);
                                      Log.Information("Lobby created. Code: {GameCode}", code.Code);
                                      lobbyCreated.TrySetResult(code);
                                  }
                              }
                          }
                          catch (Exception ex)
                          {
                              Log.Error(ex, "Could not decode lobby-creation response.");
                          }

                          return default;
                      };

                      creatorConnection.Disconnected = e =>
                      {
                          Log.Warning("Lobby creator disconnected: {Reason}", e.Reason);
                          lobbyCreated.TrySetException(new InvalidOperationException(e.Reason));
                          return default;
                      };

                      var creatorHandshake = CreateHandshake("SXBCreate");
                      var createGame = MessageWriter.Get(MessageType.Reliable);
                      Message00HostGameC2S.Serialize(createGame, new NormalGameOptions
                      {
                          MaxPlayers = 4,
                          NumImpostors = 1,
                      }, CrossplayFlags.All, GameFilterOptions.CreateDefault());

                      try
                      {
                          await creatorConnection.ConnectAsync(creatorHandshake.ToByteArray(false));
                          creatorHandshake.Recycle();
                          Log.Information("Lobby creator connected; requesting a lobby.");
                          await creatorConnection.SendAsync(createGame);
                          createGame.Recycle();

                          var created = await Task.WhenAny(lobbyCreated.Task, Task.Delay(TimeSpan.FromSeconds(15)));
                          if (created != lobbyCreated.Task)
                          {
                              throw new TimeoutException("No lobby code received within 15 seconds.");
                          }

                          var gameCode = await lobbyCreated.Task;

                          // The lobby-creation socket is not itself a game player. Join with a
                          // second client first so a real bot player receives HostId before humans.
                          using var botConnection = new UdpClientConnection(
                              new IPEndPoint(IPAddress.Loopback, 22023), readerPool);

                          botConnection.DataReceived = e =>
                          {
                              try
                              {
                                  while (e.Message.Position < e.Message.Length)
                                  {
                                      using var message = e.Message.ReadMessage();
                                      if (message.Tag == MessageFlags.JoinedGame)
                                      {
                                          var receivedCode = message.ReadInt32();
                                          var playerId = message.ReadInt32();
                                          var hostId = message.ReadInt32();
                                          if (receivedCode == gameCode.Value && playerId == hostId)
                                          {
                                              Log.Information("BMGmonke?! joined first and is now lobby host (player {PlayerId}).", playerId);
                                              botJoinedAsHost.TrySetResult(playerId);
                                          }
                                      }
                                  }
                              }
                              catch (Exception ex)
                              {
                                  Log.Error(ex, "Could not decode bot join response.");
                              }

                              return default;
                          };

                          botConnection.Disconnected = e =>
                          {
                              Log.Warning("BMGmonke?! disconnected: {Reason}", e.Reason);
                              botJoinedAsHost.TrySetException(new InvalidOperationException(e.Reason));
                              return default;
                          };

                          var botHandshake = CreateHandshake("BMGmonke?!");
                          try
                          {
                              await botConnection.ConnectAsync(botHandshake.ToByteArray(false));
                          }
                          finally
                          {
                              botHandshake.Recycle();
                          }

                          var joinGame = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              joinGame.StartMessage(MessageFlags.JoinGame);
                              joinGame.Write(gameCode.Value);
                              joinGame.Write(false);
                              joinGame.EndMessage();
                              await botConnection.SendAsync(joinGame);
                          }
                          finally
                          {
                              joinGame.Recycle();
                          }

                          var joined = await Task.WhenAny(botJoinedAsHost.Task, Task.Delay(TimeSpan.FromSeconds(15)));
                          if (joined != botJoinedAsHost.Task)
                          {
                              throw new TimeoutException("BMGmonke?! did not become the first player/host within 15 seconds.");
                          }

                          // Enter the actual game scene. Without SceneChangeFlag the
                          // server never synchronizes game objects or creates PlayerInfo.
                          var hostPlayerId = await botJoinedAsHost.Task;
                          var sceneChange = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              // Every GameData root message starts with the lobby code.
                              // Omitting it makes the server parse the scene tag as a game code
                              // and silently discard the scene transition.
                              sceneChange.StartMessage(MessageFlags.GameData);
                              sceneChange.Write(gameCode.Value);
                              sceneChange.StartMessage(6); // GameDataTag.SceneChangeFlag
                              sceneChange.WritePacked(hostPlayerId);
                              sceneChange.Write("OnlineGame");
                              sceneChange.EndMessage();
                              sceneChange.EndMessage();
                              await botConnection.SendAsync(sceneChange);
                              Log.Information("BMGmonke?! sent OnlineGame scene transition for client {PlayerId}.", hostPlayerId);
                          }
                          finally
                          {
                              sceneChange.Recycle();
                          }

                          // Tell the server the host finished loading OnlineGame.
                          var clientReady = MessageWriter.Get(MessageType.Reliable);
                          try
                          {
                              clientReady.StartMessage(MessageFlags.GameData);
                              clientReady.Write(gameCode.Value);
                              clientReady.StartMessage(7); // GameDataTag.ClientReady
                              clientReady.WritePacked(hostPlayerId);
                              clientReady.EndMessage();
                              clientReady.EndMessage();
                              await botConnection.SendAsync(clientReady);
                              Log.Information("BMGmonke?! sent ClientReady for host {PlayerId}.", hostPlayerId);
                          }
                          finally
                          {
                              clientReady.Recycle();
                          }

                          Log.Information("BMGmonke?! is staying connected. The lobby remains open for humans until the host process is stopped.");
                          await Task.Delay(System.Threading.Timeout.InfiniteTimeSpan);
                      }
                      finally
                      {
                          creatorHandshake.Recycle();
                          createGame.Recycle();
                      }


                  }
              }
          }
          CS

      - name: Patch SXB bot spawn timeout and build ARM64 server
        working-directory: impostor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/Impostor.Server/Net/State/ClientPlayer.cs")
          s = p.read_text()
          marker = "Retaining SXB bot"
          if marker not in s:
              start = s.index("if (Character == null)", s.index("private async void RunSpawnTimeout"))
              brace = s.index("{", start)
              depth = 0
              end = None
              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit("Unbalanced RunSpawnTimeout block.")
              replacement = """if (Character == null)
                  {
                      if (Client.Name is "SXBWatcher" or "BMGmonke?!")
                      {
                          _logger.LogInformation("{0} - Retaining SXB bot {1} ({2}) without Unity PlayerControl.", Game.Code, Client.Name, Client.Id);
                      }
                      else
                      {
                          _logger.LogInformation("{0} - Player {1} spawn timed out, kicking.", Game.Code, Client.Id);
                          await KickAsync();
                      }
                  }"""
              s = s[:start] + replacement + s[end:]
              p.write_text(s)
          print("SXB bot-only spawn timeout exemption applied.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Impostor.Server/Net/Inner/Objects/InnerPlayerControl.cs')
          s = p.read_text()
          old = '''        public override ValueTask<bool> SerializeAsync(IMessageWriter writer, bool initialState)
          {
              throw new NotImplementedException();
          }'''
          new = '''        public override ValueTask<bool> SerializeAsync(IMessageWriter writer, bool initialState)
          {
              if (initialState) writer.Write(IsNew);
              writer.Write(PlayerId);
              return new ValueTask<bool>(true);
          }'''
          if old not in s: raise SystemExit('InnerPlayerControl serializer patch mismatch')
          p.write_text(s.replace(old, new, 1))
          p = Path('src/Impostor.Server/Net/Inner/Objects/Components/InnerPlayerPhysics.cs')
          s = p.read_text()
          old = '''        public override ValueTask<bool> SerializeAsync(IMessageWriter writer, bool initialState)
          {
              throw new NotImplementedException();
          }'''
          new = '''        public override ValueTask<bool> SerializeAsync(IMessageWriter writer, bool initialState)
          {
              return new ValueTask<bool>(false);
          }'''
          if old not in s: raise SystemExit('InnerPlayerPhysics serializer patch mismatch')
          s = s.replace(old, new, 1)
          old = '''        public override ValueTask DeserializeAsync(IClientPlayer sender, IClientPlayer? target, IMessageReader reader, bool initialState)
          {
              throw new NotImplementedException();
          }'''
          new = '''        public override ValueTask DeserializeAsync(IClientPlayer sender, IClientPlayer? target, IMessageReader reader, bool initialState)
          {
              return default;
          }'''
          if old not in s: raise SystemExit('InnerPlayerPhysics deserializer patch mismatch')
          p.write_text(s.replace(old, new, 1))
          print('Vanilla player component serializers applied.')
          PY
          dotnet publish src/Impostor.Server/Impostor.Server.csproj -c Release -r linux-arm64 --self-contained false -p:UseAppHost=false -o ../server-publish

      - name: Upload patched ARM64 server
        uses: actions/upload-artifact@v4
        with:
          name: sxb-impostor-server-linux-arm64
          path: server-publish/
          if-no-files-found: error
          retention-days: 7

      - name: Build ARM64 client
        working-directory: impostor
        run: dotnet publish src/Impostor.Client.App/Impostor.Client.App.csproj -c Release -r linux-arm64 --self-contained false -p:UseAppHost=false -o ../publish

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxb-lobby-host-linux-arm64
          path: publish/
          if-no-files-found: error
          retention-days: 7
